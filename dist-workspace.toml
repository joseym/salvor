[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. npm is deliberately absent: dist's
# own npm installer template has no override point, and it always ships a
# Node.js relay in front of the binary (spawnSync into the download). That
# relay cannot be killed: SIGTERM/SIGKILL/Ctrl-C on the launched PID kills the
# relay and orphans the real `salvor` process, which runs the durable job to
# completion anyway. That defeats "kill it, resume it" for exactly the door
# most users install through. npm/salvor-cli/ is a repo-owned replacement,
# published by .github/workflows/npm-cli.yml, whose postinstall replaces its
# own bin entry file's bytes with the downloaded binary so there is no relay
# left to kill. See npm/salvor-cli/README-internal.md for the full mechanism.
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# The musl pair is statically linked (no glibc dependency), so these are the
# builds that actually run on Alpine and in slim/scratch containers, where the
# glibc triples above will not run.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Feature selection (default-features off, to ship only the real `salvor`
# binary) and the salvor-tools opt-out live in the per-package
# [package.metadata.dist] tables in crates/salvor-cli/Cargo.toml and
# crates/salvor-tools/Cargo.toml, since feature keys apply per package.
# Do not run this workflow on pull requests. It fires only on a pushed version
# tag (see the tag pattern in the generated release.yml). This keeps the
# pipeline dormant: nothing builds or publishes until a `v*` tag exists.
pr-run-mode = "skip"
# Steps injected ahead of the cargo build in CI: they produce `bridge/dist`, which the `ui`
# feature embeds. Without them the release binaries ship with no dashboard.
# Path is relative to .github/workflows/, so this points one level up: a file that lives IN
# .github/workflows/ is treated by GitHub as a workflow, and one with no `on:` trigger fails
# instantly on every push.
github-build-setup = "../build-setup.yml"
# dist has nothing left to publish itself: npm is repo-owned (see the
# `installers` comment above) and published by
# .github/workflows/npm-cli.yml, not by dist. The Homebrew formula is still
# only BUILT and attached to the release: joseym/homebrew-tap exists, but
# pushing to it needs a HOMEBREW_TAP_TOKEN that does not, and a job that
# always fails turns every release red. Add "homebrew" back here alongside
# the secret when that channel is real.
publish-jobs = []
# The Homebrew tap the formula is pushed to, giving `brew install joseym/tap/salvor`.
tap = "joseym/homebrew-tap"
# The Homebrew formula name.
formula = "salvor"
