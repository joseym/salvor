[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Feature selection (default-features off, to ship only the real `salvor`
# binary) and the salvor-tools opt-out live in the per-package
# [package.metadata.dist] tables in crates/salvor-cli/Cargo.toml and
# crates/salvor-tools/Cargo.toml, since feature keys apply per package.
# Do not run this workflow on pull requests. It fires only on a pushed version
# tag (see the tag pattern in the generated release.yml). This keeps the
# pipeline dormant: nothing builds or publishes until a `v*` tag exists.
pr-run-mode = "skip"
# Steps injected ahead of the cargo build in CI: they produce `bridge/dist`, which the `ui`
# feature embeds. Without them the release binaries ship with no dashboard.
# Path is relative to .github/workflows/, so this points one level up: a file that lives IN
# .github/workflows/ is treated by GitHub as a workflow, and one with no `on:` trigger fails
# instantly on every push.
github-build-setup = "../build-setup.yml"
# The npm installer package goes to the registry on every tag, using the NPM_TOKEN secret. The
# Homebrew formula is still only BUILT and attached to the release: joseym/homebrew-tap exists, but
# pushing to it needs a HOMEBREW_TAP_TOKEN that does not, and a job that always fails turns every
# release red. Add "homebrew" back alongside the secret when that channel is real.
publish-jobs = ["npm"]
# The Homebrew tap the formula is pushed to, giving `brew install joseym/tap/salvor`.
tap = "joseym/homebrew-tap"
# The Homebrew formula name.
formula = "salvor"
# The npm package name for the binary-installer package. Scoped to match
# @salvor-run/client rather than published under a personal account: the
# unscoped `salvor` name is real and live (v0.5.1, published while this was
# still provisional) but is not the intended long-term package.
npm-package = "@salvor-run/cli"
