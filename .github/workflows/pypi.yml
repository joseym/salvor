# Publishes the Python SDK to PyPI on a version tag.
#
# This is a separate workflow from release.yml because that file is generated by `dist generate`,
# which overwrites hand edits. The two run on the same tag pattern, so one push ships the crates,
# the binaries, the npm package, and this.
#
# Authentication is PyPI's trusted publishing: GitHub mints a short-lived OIDC token that PyPI
# verifies against a publisher it has on record for this repository, workflow file, and environment.
# There is no API token stored anywhere, so there is none to leak or rotate. Configure the publisher
# at pypi.org/manage/project/salvor/settings/publishing (or as a pending publisher, before the
# project exists) with:
#
#   owner: joseym   repository: salvor   workflow: pypi.yml   environment: pypi
name: PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The only permission trusted publishing needs: mint an OIDC token for PyPI to verify.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The suite runs before the upload, not after: a PyPI version is immutable, so a broken
      # release cannot be replaced, only yanked and superseded.
      - name: Test
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest tests -q

      - name: Build the sdist and wheel
        working-directory: sdks/python
        run: |
          python -m pip install build
          python -m build

      # The tag is the release's identity; a distribution built from a manifest that says something
      # else would publish a version nobody tagged.
      - name: Check the built version matches the tag
        working-directory: sdks/python
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*salvor-(.*)\.tar\.gz/\1/')
          if [ "$tag" != "$built" ]; then
            echo "tag $tag does not match the built distribution $built" >&2
            exit 1
          fi
          echo "tag and distribution agree on $built"

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
