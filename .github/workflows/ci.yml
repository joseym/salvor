name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Proves salvor-replay stays pure: the crate builds for the browser target
      # with its randomness-drawing constructor (RunId::new, behind the `rng`
      # feature) turned off. This is the prerequisite for the v0.3 client-side
      # replay, which folds event logs with the same code in wasm.
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build salvor-replay for wasm32 (purity proof)
        run: cargo build -p salvor-replay --target wasm32-unknown-unknown --no-default-features
