# Injected into every dist build job (see `github-build-setup` in dist-workspace.toml).
#
# The release binaries embed the Bridge, and `bridge/dist` is a build output that is not in git, so
# it has to be produced before cargo runs. Without this, the binary compiles against an empty asset
# folder and serves no dashboard: the server starts, the API answers, and only `/` reveals that the
# UI never shipped.
#
# The chain mirrors the `ui` job in ci.yml, because the Bridge cannot build without its two local
# dependencies: the wasm fold package (a Rust crate) and the TypeScript client, both referenced by
# path from bridge/package.json.
#
# Every command uses `--prefix` rather than `working-directory`: dist re-serializes these steps into
# release.yml and drops keys it does not recognize, so a step relying on `working-directory` would
# silently run at the repo root.
- name: Add the wasm target for the fold package
  run: rustup target add wasm32-unknown-unknown
  shell: bash

- name: Set up Node for the Bridge build
  uses: actions/setup-node@v6
  with:
    node-version: "24"

- name: Install wasm-pack
  uses: jetli/wasm-pack-action@v0.4.0
  with:
    version: latest

- name: Build the wasm fold package
  run: wasm-pack build crates/salvor-replay-wasm --target web --out-dir pkg --out-name salvor_replay_wasm
  shell: bash

- name: Build the TypeScript client
  run: npm ci --prefix sdks/typescript && npm run build --prefix sdks/typescript
  shell: bash

- name: Build the Bridge
  run: npm ci --prefix bridge && npm run build --prefix bridge
  shell: bash

- name: Verify the Bridge output exists
  shell: bash
  run: |
    test -s bridge/dist/bridge/browser/index.html
    test -s bridge/dist/bridge/browser/salvor_replay_wasm_bg.wasm
