# Injected into every dist build job (see `github-build-setup` in dist-workspace.toml).
#
# The release binaries embed the Bridge, and `bridge/dist` is a build output that is not in git, so
# it has to be produced before cargo runs. Without this, the binary compiles against an empty asset
# folder and serves no dashboard, which is a silent failure: the server starts, the API answers, and
# only `/` reveals that the UI never shipped.
- name: Set up Node for the Bridge build
  uses: actions/setup-node@v6
  with:
    node-version: "24"
    cache: npm
    cache-dependency-path: bridge/package-lock.json

# The directory change lives INSIDE `run`: dist re-serializes these steps into release.yml and
# drops keys it does not know about, `working-directory` among them, so a step that relies on it
# silently runs at the repo root.
- name: Build the Bridge
  run: cd bridge && npm ci && npm run build
  shell: bash

- name: Verify the Bridge output exists
  shell: bash
  run: test -f bridge/dist/bridge/browser/index.html
