# Publishes the TypeScript SDK (@salvor-run/client) to npm on a version tag.
#
# Separate from release.yml on purpose. That file is generated by `dist generate` and its npm job
# publishes a different package: the CLI installer (`salvor`), which wraps the release binaries.
# This one publishes the client library, which is plain TypeScript and has nothing to do with the
# binary artifacts. Both fire on the same tag, so one push ships every channel.
name: npm client

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # The suite runs before the upload: a published npm version can be deprecated but not
      # replaced, and unpublishing is restricted after 72 hours.
      - name: Test
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test

      - name: Build
        working-directory: sdks/typescript
        run: npm run build

      # The tag is the release's identity. set-version.sh stamps package.json on every bump, so a
      # mismatch here means the bump did not run, and publishing would put a version on the registry
      # that no tag points at.
      - name: Check the manifest matches the tag
        working-directory: sdks/typescript
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "tag $tag does not match package.json $manifest" >&2
            exit 1
          fi
          echo "tag and manifest agree on $manifest"

      # Refuse to republish a version that already exists rather than failing the whole release on
      # npm's E409: re-running a tag should be safe.
      - name: Skip if this version is already on the registry
        id: published
        working-directory: sdks/typescript
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published, nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.already == 'false'
        working-directory: sdks/typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
