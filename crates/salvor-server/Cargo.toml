[package]
name = "salvor-server"
description = "Salvor control plane: an HTTP + server-sent-events server over the durable runtime"
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
# The embedded dashboard is OPT-IN, because it cannot work from a published crate: the assets it
# embeds live at ../../bridge/dist, outside this package, so a crates.io consumer building with
# `ui` gets a compile error about a folder that a registry build has no way to produce. Leaving it
# off by default means `cargo add salvor-server` builds a headless, API-only control plane
# everywhere. `salvor-cli` names `ui` explicitly, so the shipped `salvor serve` is unaffected and
# still answers the API and the web app on one origin.
default = []
ui = ["dep:rust-embed"]

[dependencies]
salvor-core.workspace = true
salvor-store.workspace = true
salvor-runtime.workspace = true
# The graph control plane: the document format and its strict validator
# (`salvor-graph`), the engine that drives a validated document over a `RunCtx`
# (`salvor-engine`), and the pure per-node fold the canvas reads
# (`salvor-replay`, for `derive_graph_projection`). A graph run is an ordinary
# run with a richer log, so these sit alongside the runtime, not in place of it.
salvor-graph.workspace = true
salvor-engine.workspace = true
salvor-replay.workspace = true
# The server-performed model step (client-driven runs) reuses the model
# transport (`Client`, its raw-value send/stream methods) and the streaming
# accumulator this crate holds, and forwards the caller's `MessageRequest` value
# verbatim, so `salvor-llm` is a normal dependency, not only a test one.
salvor-llm.workspace = true
# The server drives MCP-backed agents, so a built agent hands back the live
# `McpServer` sessions its tools hold; the run driver keeps them alive for the
# life of the run and closes them after. That type is the only thing this crate
# needs from the tools layer.
salvor-tools.workspace = true
# The general model-executor seam is an async trait the embedding binary
# implements (the `AgentFactory`-style injection), so the crate needs the
# async-trait attribute in its public surface.
async-trait.workspace = true
axum.workspace = true
# Only the `ui` feature compiles the embedded dashboard; a headless build never
# pulls it in.
rust-embed = { workspace = true, optional = true }
tokio.workspace = true
tokio-stream.workspace = true
# The token file: named bearer tokens stored as SHA-256 hashes. `toml` parses
# the file (the server re-reads it when it changes, so file reading is this
# crate's rather than the CLI's, unlike an agent definition or a client-tool
# declaration), `sha2` hashes a presented bearer, and `subtle` compares two
# digests in constant time. `getrandom` is the OS CSPRNG `salvor token new`
# mints from; already resolved in the tree through uuid's `v4` feature, so
# naming it here adds no new crate.
toml.workspace = true
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true

# The token file's mode and owner are checked on every read, and the owner
# check needs the uid this process runs as, which `libc::geteuid` is the only
# way to ask for. Unix only, and already resolved in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The tests drive the bound server over real loopback HTTP with reqwest, script
# the model with wiremock, and read server-sent events from the raw byte
# stream, so reqwest gains its `stream` feature here.
reqwest = { workspace = true, features = ["stream"] }
wiremock.workspace = true
tempfile.workspace = true
# The corrupt-log honesty test tampers with a row's envelope JSON directly
# through a second raw connection to the same file-backed SQLite store, to
# prove `GET /v1/runs` degrades that one run's entry rather than the whole
# list.
rusqlite.workspace = true
futures-util = "0.3"
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
