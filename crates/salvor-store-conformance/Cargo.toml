[package]
name = "salvor-store-conformance"
description = "Store-agnostic conformance kit that proves an EventStore implementation satisfies the salvor-store trait contract"
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
salvor-core.workspace = true
salvor-store.workspace = true
serde_json.workspace = true
time.workspace = true
# The kit spawns racing tasks and gates them behind a barrier to force the
# concurrency check's contention, so it needs a task spawner (`rt`) and an
# async barrier (`sync`). `macros` is for the crate's own self-test below. A
# consumer supplies the runtime; the kit only borrows the current one.
tokio = { version = "1", features = ["rt", "sync", "macros"] }
# The kit defines a trait with an async method (`TamperHarness`), the same way
# `EventStore` itself is defined, so it needs the same rewriting macro.
async-trait.workspace = true

[dev-dependencies]
# The self-test drives the checks against an in-crate reference store, and its
# concurrency check wants real threads, so the multi-threaded scheduler is
# added here.
tokio = { version = "1", features = ["rt-multi-thread"] }
