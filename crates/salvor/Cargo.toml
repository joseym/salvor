[package]
name = "salvor"
# Workspace-inherited now that this is a real facade: the re-exports pin their siblings to `=`
# this version, so the umbrella and the family it fronts can never drift apart.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Durable execution runtime for AI agents in Rust: event-sourced runs, typed tool effects, crash-exact resume. One dependency over the salvor-* family."
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
# Enough to define an agent, run it, kill it, and resume it. Anything that drags in a network
# server, a wasm engine, or a graph walker is opt-in.
#
# `llm` sits in this list even though it is a whole Messages API client: `runtime` already
# depends on `salvor-llm` unconditionally (the agent loop calls a model, so it has no optional
# path around that dependency), so every default build compiles reqwest and the rest of that
# tree regardless of this feature. Adding `llm` here costs zero new crates; what it buys is the
# re-export, so `Config` resolves without an extra opt-in the dependency graph already paid for.
default = ["runtime", "tools", "store", "llm"]

runtime = ["dep:salvor-runtime"]
tools = ["dep:salvor-tools"]
store = ["dep:salvor-store"]
graph = ["dep:salvor-graph"]
# The engine walks a graph document, so it cannot be useful without the document types.
engine = ["dep:salvor-engine", "graph"]
server = ["dep:salvor-server"]
llm = ["dep:salvor-llm"]
wasm = ["dep:salvor-wasm"]
# Forwarded rather than re-declared: MCP support lives in salvor-tools' own feature.
mcp = ["tools", "salvor-tools/mcp"]

[dependencies]
# `=` on every sibling: a facade whose parts can move independently is a facade that lies about
# what it was tested with.
salvor-core = { path = "../salvor-core", version = "=0.10.0" }
salvor-runtime = { path = "../salvor-runtime", version = "=0.10.0", optional = true }
salvor-tools = { path = "../salvor-tools", version = "=0.10.0", optional = true }
salvor-store = { path = "../salvor-store", version = "=0.10.0", optional = true }
salvor-graph = { path = "../salvor-graph", version = "=0.10.0", optional = true }
salvor-engine = { path = "../salvor-engine", version = "=0.10.0", optional = true }
salvor-server = { path = "../salvor-server", version = "=0.10.0", optional = true }
salvor-llm = { path = "../salvor-llm", version = "=0.10.0", optional = true }
salvor-wasm = { path = "../salvor-wasm", version = "=0.10.0", optional = true }
# Not optional: every sibling that takes a run's input takes it as a `serde_json::Value`, so
# the umbrella re-exports `json!` unconditionally rather than gating it behind a feature that
# would make the macro vanish under some builds and not others.
serde_json.workspace = true

[package.metadata.docs.rs]
# Document the whole surface, including the opt-in modules, so the crate page shows what is
# available rather than only the default build. `ui` is deliberately absent from this: the
# dashboard assets live outside the published package, so no registry build can embed them.
all-features = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
