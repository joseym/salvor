[package]
name = "salvor-tools"
description = "ToolHandler trait, derive macro, and MCP client integration for the Salvor agent runtime"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

# salvor-tools declares one binary, `salvor-mcp-fixture`, which is a test
# fixture gated behind `required-features = ["mcp"]`. It is not product surface,
# so it must never ship in a release. dist auto-distributes any workspace
# package that has a binary; this opts salvor-tools out entirely, leaving
# salvor-cli's `salvor` as the only released binary.
[package.metadata.dist]
dist = false

[features]
# `mcp` gates the entire Model Context Protocol integration: the `mcp` module,
# the rmcp SDK, and the Tokio runtime rmcp needs. It is on by default so the
# batteries-included build has MCP, but the contract layer (ToolHandler,
# DynTool, ToolSet, the derive) must still build without it. CI-equivalent
# check: `cargo build -p salvor-tools --no-default-features` succeeds.
#
# Enabling `mcp` turns on both the client-side rmcp features the product uses
# (connecting to a server over stdio OR streamable HTTP, listing and calling
# tools) and the server-side features (server, transport-io, macros, and the
# streamable-HTTP server). The server-side half is not product surface: it
# exists only to build the in-repo test fixtures (`src/bin/salvor-mcp-fixture.rs`
# over stdio, and the in-process HTTP server the HTTP integration tests spin
# up), which the tests drive. Keeping one feature avoids a second, non-default
# feature that `cargo test` defaults would then miss.
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio"]

[dependencies]
salvor-core.workspace = true
salvor-tools-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
schemars.workspace = true
rmcp = { workspace = true, optional = true, features = [
    "client",
    "transport-child-process",
    # The remote-server product path: connect to an MCP server by URL over the
    # streamable-HTTP transport, using the bundled reqwest client. This pulls in
    # `transport-streamable-http-client` transitively.
    "transport-streamable-http-client-reqwest",
    "server",
    "transport-io",
    # The server half of the streamable-HTTP transport, test-support only: the
    # HTTP integration tests serve an MCP server in-process on a loopback port.
    "transport-streamable-http-server",
    "macros",
    "schemars",
] }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# `net` is added over the base test features so the HTTP integration test can
# bind a loopback `TcpListener`; `axum` serves the in-process fixture server
# that rmcp's `StreamableHttpService` plugs into. Both are test-only.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"] }
axum.workspace = true

# The hermetic MCP test fixture. It is a real server binary spawned over stdio
# by the integration tests, not an in-process mock, because the product path is
# "spawn a child process and speak MCP over its stdio" and respawn-on-resume
# means constructing a fresh child. `required-features = ["mcp"]` means it is
# skipped under `--no-default-features`, keeping the contract-layer build clean.
# Cargo sets CARGO_BIN_EXE_salvor-mcp-fixture for the integration tests, so they
# locate the built binary with no path guessing and no external dependency.
[[bin]]
name = "salvor-mcp-fixture"
path = "src/bin/salvor-mcp-fixture.rs"
required-features = ["mcp"]
