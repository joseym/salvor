[package]
name = "salvor-tools"
description = "ToolHandler trait, derive macro, and MCP client integration for the Salvor agent runtime"
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

# salvor-tools declares two binaries, `salvor-mcp-fixture` and
# `salvor-mcp-parent`, both test fixtures gated behind
# `required-features = ["mcp"]`. Neither is product surface, so neither must
# ever ship in a release. dist auto-distributes any workspace package that has a
# binary; this opts salvor-tools out entirely, leaving salvor-cli's `salvor` as
# the only released binary.
[package.metadata.dist]
dist = false

[features]
# `mcp` gates the entire Model Context Protocol integration: the `mcp` module,
# the rmcp SDK, and the Tokio runtime rmcp needs. It is on by default so the
# batteries-included build has MCP, but the contract layer (ToolHandler,
# DynTool, ToolSet, the derive) must still build without it. CI-equivalent
# check: `cargo build -p salvor-tools --no-default-features` succeeds.
#
# Enabling `mcp` turns on both the client-side rmcp features the product uses
# (connecting to a server over stdio OR streamable HTTP, listing and calling
# tools) and the server-side features (server, transport-io, macros, and the
# streamable-HTTP server). The server-side half is not product surface: it
# exists only to build the in-repo test fixtures (`src/bin/salvor-mcp-fixture.rs`
# over stdio, and the in-process HTTP server the HTTP integration tests spin
# up), which the tests drive. Keeping one feature avoids a second, non-default
# feature that `cargo test` defaults would then miss.
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio", "dep:process-wrap", "dep:libc"]

[dependencies]
# Only for `Effect`, which this crate re-exports. `default-features = false`
# turns off salvor-core's `rng` forward: nothing here mints a run id, so the
# randomness backend it would drag in is dead weight on a native build and a
# compile error on wasm32-unknown-unknown. That matters because the CLI's pure
# half (salvor-cli-core) parses agent files, and an agent file declares
# idempotency paths, so it reaches `IdempotencyPath` in this crate from a
# wasm32 build. Native builds are unaffected: Cargo unions features, and every
# native consumer that wants `RunId::new` still asks for it.
salvor-core = { path = "../salvor-core", version = "0.9.2", default-features = false }
salvor-tools-macros.workspace = true
# Only for `OffsetDateTime`, the wake instant a `Sleep` outcome carries. The
# type alone: nothing here reads a clock, which is what keeps this crate
# buildable for wasm32-unknown-unknown, where `now_utc` has no source.
time.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
schemars.workspace = true
rmcp = { workspace = true, optional = true, features = [
    "client",
    "transport-child-process",
    # The remote-server product path: connect to an MCP server by URL over the
    # streamable-HTTP transport, using the bundled reqwest client. This pulls in
    # `transport-streamable-http-client` transitively.
    "transport-streamable-http-client-reqwest",
    "server",
    "transport-io",
    # The server half of the streamable-HTTP transport, test-support only: the
    # HTTP integration tests serve an MCP server in-process on a loopback port.
    "transport-streamable-http-server",
    "macros",
    "schemars",
] }
tokio = { workspace = true, optional = true }
# The command wrapper rmcp's own child-process transport is built on. Naming it
# here is what lets `McpServer::connect` hand rmcp a command already carrying a
# process group and kill-on-drop, so an MCP server and anything it spawned die
# as one unit. See the workspace pin for why the version must match rmcp's.
process-wrap = { workspace = true, optional = true }
# Unix only in effect (every call site is behind `cfg`), but declared plainly
# rather than under a target table so the `mcp` feature can enable it the same
# way on every platform. Used for the Linux parent-death signal an MCP child
# arms for itself between fork and exec.
libc = { workspace = true, optional = true }

[dev-dependencies]
# `net` is added over the base test features so the HTTP integration test can
# bind a loopback `TcpListener`; `axum` serves the in-process fixture server
# that rmcp's `StreamableHttpService` plugs into. Both are test-only.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"] }
axum.workspace = true
# The child-lifecycle tests hand the fixture server a scratch directory to write
# its pid files into, so a test learns which process to watch without the
# public API growing a pid accessor it has no product use for.
tempfile.workspace = true

# The hermetic MCP test fixture. It is a real server binary spawned over stdio
# by the integration tests, not an in-process mock, because the product path is
# "spawn a child process and speak MCP over its stdio" and respawn-on-resume
# means constructing a fresh child. `required-features = ["mcp"]` means it is
# skipped under `--no-default-features`, keeping the contract-layer build clean.
# Cargo sets CARGO_BIN_EXE_salvor-mcp-fixture for the integration tests, so they
# locate the built binary with no path guessing and no external dependency.
[[bin]]
name = "salvor-mcp-fixture"
path = "src/bin/salvor-mcp-fixture.rs"
required-features = ["mcp"]

# The second half of the child-lifecycle proof, and a test fixture on the same
# terms as the one above. It is a stand-in parent: it connects to the fixture
# server through the real `McpServer::connect` and then does nothing, so a test
# can kill *it* and observe what became of the server. A test cannot prove that
# about itself without killing the process doing the asserting.
[[bin]]
name = "salvor-mcp-parent"
path = "src/bin/salvor-mcp-parent.rs"
required-features = ["mcp"]
