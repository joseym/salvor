[package]
name = "salvor-core"
description = "Event model, replay engine, budget enforcement, and deterministic context for the Salvor agent runtime"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# The event model, replay cursor, and state fold live in salvor-replay (a pure,
# wasm32-buildable crate); this crate re-exports them so every existing
# `salvor_core::` path keeps resolving. Default features keep `rng` on, so
# `RunId::new` stays available to native consumers exactly as before.
salvor-replay.workspace = true
