[package]
name = "salvor-llm"
description = "Messages API client for Anthropic-compatible endpoints (hosted and local), used by the Salvor agent runtime"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
reqwest.workspace = true
tokio.workspace = true
# tokio-stream drives the reqwest byte stream (Stream + StreamExt) when reading a
# streaming Messages response. Already a workspace dependency (salvor-server), so
# it adds nothing new to the dependency tree.
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
wiremock.workspace = true
