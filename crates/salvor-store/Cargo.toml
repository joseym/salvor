[package]
name = "salvor-store"
description = "EventStore trait and SQLite (WAL) implementation for the Salvor agent runtime"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
salvor-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
rusqlite.workspace = true
async-trait.workspace = true

[dev-dependencies]
# Path-only on purpose: the conformance kit depends on this crate, so a versioned dev-dep
# would be a publish-time cycle. Cargo strips a version-less dev-dependency on publish.
salvor-store-conformance = { path = "../salvor-store-conformance" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
