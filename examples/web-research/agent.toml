# A live web-research agent: fetch real pages over the official
# `mcp-server-fetch` server, then write one markdown report over the official
# `@modelcontextprotocol/server-filesystem` server. Unlike demo/, this runs
# against the public Anthropic endpoint with servers people actually use; it
# is rehearsed documentation, not a CI workload. See README.md for the run,
# the kill -9 walkthrough, and the cost estimate.
#
# Run from the repository root: the filesystem server's allowed directory
# below is a path relative to the directory salvor is invoked from, and the
# report path in input.json sits inside it.

model = "claude-opus-4-8"

system_prompt = """
You are a web-research agent. Your input is a JSON object with three fields:
`question` (what to answer), `seed_urls` (a list of pages to start from), and
`report_path` (the one file to write your report to).

Work in this order:

1. Fetch every URL in `seed_urls` using the `fetch` tool. Read what each page
   says about the question. If a page is long, page through it with the tool's
   `start_index` argument rather than fetching unrelated pages.
2. Follow at most three additional links, and only ones that clearly help
   answer the question. Do not wander: a handful of good sources beats a long
   crawl, and every fetch spends budget.
3. Write exactly ONE file, at the path given in `report_path`, using the
   filesystem server's `write_file` tool. The file is markdown: a short title,
   a two or three paragraph answer to the question, and a "Sources" list of the
   URLs you actually read. Write it once; do not rewrite or append.
4. Reply with a one-paragraph summary of what you found and stop. Do not fetch
   or write anything after the report is saved.
"""

[llm]
# The key is read from this variable at run time and never stored in any file.
api_key_env = "DEMO_ANTHROPIC_API_KEY"

[budgets]
# A focused run is roughly ten to twenty model calls: a few fetches, a few
# follow-up reads, one report write, one summary. These rails leave headroom
# for a chatty model while still parking a run that has clearly run away, so
# crossing one stops the run for a human to extend rather than burning on.
steps = 30
tokens = 500000
cost_usd = 3.00
wall_time_seconds = 600

[pricing]
# claude-opus-4-8 list price, dollars per million tokens. Needed because a
# cost budget is declared; the two together let the runtime stop the run on
# spend, not just on step count. See README.md for a per-run estimate.
input_per_mtok = 5.0
output_per_mtok = 25.0

[[mcp_servers]]
# The official Python fetch server. `uvx` installs and runs it in one step;
# the README lists a pip/venv alternative for machines without uv.
command = "uvx"
args = ["mcp-server-fetch"]
# The server declares `fetch` with no annotations, so the default mapping
# would treat it as a Write (the safe guess for an unclassified tool). We know
# better: `fetch` performs an outbound GET and returns the page, with no
# server-side state to reconcile. Pinning it to `read` is the operator's trust
# decision, and it matters on resume: an in-flight fetch that crashed before it
# was recorded simply re-runs, instead of parking the whole run for a human to
# reconcile a "write" that never wrote anything. See README.md.
effect_overrides = { fetch = "read" }

[[mcp_servers]]
# The official filesystem server, run through npx. The trailing argument is
# the one directory it may touch, resolved against the directory salvor runs
# from. Create it first (`mkdir -p examples/web-research/out`); the server
# refuses to start if the directory does not exist. The report path in
# input.json sits inside it.
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "examples/web-research/out"]
# The server annotates `write_file` with `idempotentHint: true`, which the
# default mapping would read as Idempotent (auto-retry an interrupted call
# under the same key). That is not the stance we want for the report: writing
# it is a real side effect with reconciliation stakes, so we pin it to `write`.
# On resume, an interrupted report write then surfaces for a human instead of
# being retried blind. The server's read tools already annotate `readOnlyHint`
# and map to Read on their own, so they need no override here.
effect_overrides = { write_file = "write" }
