[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salvor"
version = "0.5.3"
description = "Thin Python client for the Salvor durable-agent control plane"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Salvor" }]
# One runtime dependency. httpx handles both the JSON calls and the streaming
# read the event tail needs; nothing else is required.
dependencies = ["httpx>=0.24"]

[project.urls]
Repository = "https://github.com/joseym/salvor"

# The teaching companions next to each module are personal notes, kept out of git by a global
# ignore. A build reads the working tree rather than the index, so without an explicit exclusion
# they ride along into the published artifact.
[tool.hatch.build]
exclude = ["*.teach.md"]

[tool.hatch.build.targets.wheel]
packages = ["salvor"]
