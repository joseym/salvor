# Trunk build/serve config for the dashboard.
#
# Build: `trunk build` (or `trunk serve` for a dev server with live reload).
# If Trunk is not installed, the crate still compiles with
# `cargo build --target wasm32-unknown-unknown`; Trunk only adds the JS loader,
# asset hashing, and the dev server on top of that same wasm output.

[build]
# The HTML entry Trunk reads its `data-trunk` links from.
target = "index.html"

[serve]
# The dev server. Kept off 8080 so it does not collide with the control plane's
# default (`salvor serve`).
port = 8081
open = false

# Dev proxy: when the app is built with an empty SALVOR_API_BASE (same-origin),
# control-plane calls to /v1 are served by the control plane through this proxy,
# which sidesteps CORS in development. With the default absolute SALVOR_API_BASE
# (http://127.0.0.1:8080) the app talks to the server directly and this is unused.
[[proxy]]
backend = "http://127.0.0.1:8080/v1"
