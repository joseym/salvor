[workspace]
resolver = "3"
members = [
    "crates/salvor-core",
    "crates/salvor-store",
    "crates/salvor-llm",
    "crates/salvor-tools",
    "crates/salvor-tools-macros",
    "crates/salvor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joseym/salvor"

[workspace.dependencies]
salvor-core = { path = "crates/salvor-core" }
salvor-store = { path = "crates/salvor-store" }
salvor-llm = { path = "crates/salvor-llm" }
salvor-tools = { path = "crates/salvor-tools" }
salvor-tools-macros = { path = "crates/salvor-tools-macros" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
schemars = "1"
syn = "2"
quote = "1"
proc-macro2 = "1"
trybuild = "1"
