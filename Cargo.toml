[workspace]
resolver = "3"
members = [
    "crates/salvor-core",
    "crates/salvor-store",
    "crates/salvor-llm",
    "crates/salvor-tools",
    "crates/salvor-tools-macros",
    "crates/salvor-runtime",
    "crates/salvor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joseym/salvor"

[workspace.dependencies]
salvor-core = { path = "crates/salvor-core" }
salvor-store = { path = "crates/salvor-store" }
salvor-llm = { path = "crates/salvor-llm" }
salvor-tools = { path = "crates/salvor-tools" }
salvor-tools-macros = { path = "crates/salvor-tools-macros" }
salvor-runtime = { path = "crates/salvor-runtime" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
# rustls only: reqwest's default native-tls feature would add a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
wiremock = "0.6"
tracing = "0.1"
# CLI surface. clap parses the command tree with its derive API; toml
# parses the agent-definition file (agents are data); tracing-subscriber
# renders the human-readable run/seq progress to stderr.
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Dev-only CLI test tooling: drive the real binary and assert on its output.
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
sha2 = "0.10"
schemars = "1"
syn = "2"
quote = "1"
proc-macro2 = "1"
trybuild = "1"
# rmcp: the official Model Context Protocol SDK. Verified against crates.io on
# 2026-07-09; 2.2.0 was the latest release (published 2026-07-08). Hard-pinned
# with `=` because rmcp is a young, fast-moving SDK (rmcp/MCP protocol churn
# is a standing risk) and its client/server API still shifts between minor
# releases; a floating requirement would let a churny minor break the build
# unbidden. MCP stays isolated behind the `mcp` feature of salvor-tools, so this
# is the one crate that touches it. Bump this pin deliberately, re-reading the
# API each time, never automatically.
rmcp = { version = "=2.2.0", default-features = false }
