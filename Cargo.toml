[workspace]
resolver = "3"
members = [
    "crates/salvor-replay",
    "crates/salvor-replay-wasm",
    "crates/salvor-graph",
    "crates/salvor-core",
    "crates/salvor-store",
    "crates/salvor-store-conformance",
    "crates/salvor-llm",
    "crates/salvor-tools",
    "crates/salvor-tools-macros",
    "crates/salvor-runtime",
    "crates/salvor-engine",
    "crates/salvor-wasm",
    "crates/salvor-server",
    "crates/salvor-cli-core",
    "crates/salvor-cli-wasm",
    "crates/salvor-cli",
    "crates/salvor",
]
# Guest crates are excluded, not members: they compile only for the
# wasm32-wasip2 component target (which the host workspace never builds for),
# carry their own lockfiles, and are built by salvor-wasm's test harness / the
# example's build step, never by `cargo build --workspace`.
exclude = [
    "crates/salvor-wasm/tests/fixture-guest",
    "examples/wasm-tools/guest",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
repository = "https://github.com/joseym/salvor"
license = "MIT OR Apache-2.0"
# Verified floor: 1.94 is refused by sysinfo, 1.95 builds the workspace clean.
rust-version = "1.95"
# crates.io discovery: at most five keywords, and categories must come from its fixed list.
keywords = ["durable-execution", "event-sourcing", "agents", "workflow", "replay"]
categories = ["asynchronous", "development-tools", "web-programming"]

[workspace.dependencies]
salvor-replay = { path = "crates/salvor-replay", version = "0.7.0" }
salvor-replay-wasm = { path = "crates/salvor-replay-wasm", version = "0.7.0" }
salvor-graph = { path = "crates/salvor-graph", version = "0.7.0" }
salvor-core = { path = "crates/salvor-core", version = "0.7.0" }
salvor-store = { path = "crates/salvor-store", version = "0.7.0" }
salvor-store-conformance = { path = "crates/salvor-store-conformance", version = "0.7.0" }
salvor-llm = { path = "crates/salvor-llm", version = "0.7.0" }
salvor-tools = { path = "crates/salvor-tools", version = "0.7.0" }
salvor-tools-macros = { path = "crates/salvor-tools-macros", version = "0.7.0" }
salvor-runtime = { path = "crates/salvor-runtime", version = "0.7.0" }
salvor-engine = { path = "crates/salvor-engine", version = "0.7.0" }
salvor-wasm = { path = "crates/salvor-wasm", version = "0.7.0" }
salvor-server = { path = "crates/salvor-server", version = "0.7.0" }
salvor-cli-core = { path = "crates/salvor-cli-core", version = "0.7.0" }
salvor-cli-wasm = { path = "crates/salvor-cli-wasm", version = "0.7.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
# rustls only: reqwest's default native-tls feature would add a system OpenSSL dependency.
# The `stream` feature exposes Response::bytes_stream, which salvor-llm consumes
# to read the server-sent-events body of a streaming Messages response.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
wiremock = "0.6"
# The control-plane HTTP server (salvor-server, M14). axum is the router and
# extractor layer; it was already compiled in the workspace as a salvor-tools
# test dependency, so promoting it to a real workspace dependency adds no new
# crate to the tree. tokio-stream wraps an mpsc receiver as the `Stream` axum's
# server-sent-events response consumes.
axum = "0.8"
tokio-stream = "0.1"
tracing = "0.1"
# The dashboard the control plane embeds behind salvor-server's `ui` feature.
# rust-embed is chosen over include_dir for one property: in a debug build it
# reads the asset folder from the filesystem at request time (embedding nothing
# at compile time), so a developer rebuilding the Angular app sees the change on
# the next request without recompiling Rust; a release build bakes the bytes
# into the binary. include_dir bakes at compile time in every profile, which
# would force a Rust rebuild for every UI edit.
rust-embed = "8"
# CLI surface. clap parses the command tree with its derive API; toml
# parses the agent-definition file (agents are data); tracing-subscriber
# renders the human-readable run/seq progress to stderr.
clap = { version = "4", features = ["derive", "env"] }
# Shell completion scripts, generated from the same clap::Command the parser already builds,
# so a new subcommand or flag completes without anyone maintaining a second list.
clap_complete = "4"
# Terminal styling for the CLI tables. anstyle is the style vocabulary; anstream is the
# stream that strips those codes when stdout is not a terminal, and honours NO_COLOR and
# CLICOLOR, so a piped `salvor list` stays plain text.
anstyle = "1"
anstream = "1"
# The real terminal's column count, for `salvor graph edit`: the editor wraps
# its prose to the pane it is printing into, and the only way to know that
# number is to ask the terminal. This is the crate clap itself uses for
# `wrap_help`, and it is a thin shim over one ioctl rather than a terminal
# library: on Unix it adds nothing to the tree, since rustix is already
# resolved through sysinfo and tempfile, and its Windows half is gated to that
# target.
terminal_size = "0.4"
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Process discovery behind `salvor serve --kill`: finding a running
# `salvor serve` by inspecting the process table, cross-platform. Verified
# against crates.io on 2026-07-17; 0.39.6 was the latest release. Only the
# `system` feature is enabled (process enumeration, name/exe/cmd/kill), which
# keeps the tree light: on macOS it adds two small objc2 crates over what the
# workspace already resolves (libc, memchr, bitflags are already shared
# dependencies), on Linux it adds nothing beyond libc, and the windows-rs
# crates it pulls on that target are gated to Windows builds only. That buys
# real Windows support for both discovery and the kill signal, not just
# Unix, matching the three platforms the dist pipeline ships.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# `salvor serve --dev`'s process-group signal (tearing down `ng serve` and
# anything it spawned as one unit; see salvor-cli's dev_server module). Only
# `libc::kill` is used, on Unix. Already in the tree at 0.2 transitively
# through sysinfo and tokio's own signal handling, so this promotes it to a
# direct dependency rather than adding a new one.
libc = "0.2"
# Dev-only CLI test tooling: drive the real binary and assert on its output.
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
sha2 = "0.10"
schemars = "1"
# Property-based testing for salvor-graph's condition-language parser/evaluator:
# generate thousands of arbitrary and near-miss inputs to prove the parser never
# panics and eval is total. Dev-only, so it adds nothing to any shipped tree.
proptest = "1"
syn = "2"
quote = "1"
proc-macro2 = "1"
trybuild = "1"
# rmcp: the official Model Context Protocol SDK. Verified against crates.io on
# 2026-07-09; 2.2.0 was the latest release (published 2026-07-08). Hard-pinned
# with `=` because rmcp is a young, fast-moving SDK (rmcp/MCP protocol churn
# is a standing risk) and its client/server API still shifts between minor
# releases; a floating requirement would let a churny minor break the build
# unbidden. MCP stays isolated behind the `mcp` feature of salvor-tools, so this
# is the one crate that touches it. Bump this pin deliberately, re-reading the
# API each time, never automatically.
rmcp = { version = "=2.2.0", default-features = false }
# wasmtime: the sandbox behind salvor-wasm's untrusted-tool execution.
# Verified against crates.io on 2026-07-10; 46.0.1 was the latest release
# (published 2026-06-24), with wasmtime-wasi versioned in lockstep. Hard-pinned
# with `=` for the same reason as rmcp, with more weight behind it: wasmtime is
# a 200+-crate dependency tree that ships a new MAJOR version roughly monthly,
# so a floating requirement would take major-version churn unbidden. The pin
# still needs routine, deliberate bumps: wasmtime has had CVEs, and staying
# current is part of the sandbox's security story. All of it stays isolated in
# salvor-wasm, so a bump touches one crate.
wasmtime = { version = "=46.0.1", default-features = false, features = [
    # The trimmed feature set for a sync component host: compile (cranelift)
    # and run (runtime) WebAssembly components, with std for file loading.
    # Deliberately absent: async (calls are sync under spawn_blocking), gc,
    # profiling, cache, and the pooling allocator.
    "runtime",
    "cranelift",
    "component-model",
    "std",
    "parallel-compilation",
] }
wasmtime-wasi = { version = "=46.0.1", default-features = false, features = [
    # p2 is the WASI 0.2 host implementation the `salvor:tool` world's guests
    # import; p1 (preview 1) support is deliberately absent.
    "p2",
] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
